<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1f1a">
<title>سبح</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="update" class="update hidden">
  <div class="urow">
    <div><b id="uTitle">تحديث جديد</b><div id="uNotes" class="mut small"></div></div>
    <div class="ubtns"><button id="uGo" class="btn gold">تحديث</button><button id="uLater" class="btn ghost">لاحقاً</button></div>
  </div>
  <div id="uBarWrap" class="bar hidden"><i id="uBar"></i></div>
  <div id="uInfo" class="mut small hidden"></div>
</div>

<main>
  <section id="tab-home" class="tab active">
    <div class="chips"><div class="chip" id="chStreak"></div><div class="chip" id="chLevel"></div><div class="chip" id="chFreeze"></div></div>
    <div id="miss" class="card miss"></div>
    <div class="ringwrap">
      <svg viewBox="0 0 300 300"><circle class="bgc" cx="150" cy="150" r="135"/><circle id="ring" class="fg" cx="150" cy="150" r="135"/></svg>
      <button id="tap"><span id="dh"></span><b id="cnt">0</b></button>
    </div>
    <div id="fadl" class="fadl"></div>
    <div id="stats" class="center mut small"></div>
    <div class="ctl"><button id="tgtBtn" class="btn ghost"></button><button id="undo" class="btn ghost">↩️ تراجع</button><button id="vibBtn" class="btn ghost"></button></div>
    <div id="dhikrs" class="dhikrs"></div>
    <button id="resetCnt" class="btn ghost small">تصفير هذا العداد</button>
    <div id="ad"></div>
  </section>

  <section id="tab-az" class="tab">
    <div id="azSeg" class="seg wrap"></div>
    <div class="mut small center">المس الذكر ليعدّ تنازليًا، وإتمام المجموعة يحسب مهمة</div>
    <div id="azList"></div>
  </section>

  <section id="tab-chat" class="tab">
    <div class="card center"><div class="mut small">رقمك الخاص</div><b id="myNum" style="font-size:22px;letter-spacing:1px;color:var(--gold)">...</b></div>
    <div class="ctl"><button id="chNew" class="btn gold">➕ محادثة برقم</button><button id="chGrp" class="btn ghost">👥 مجموعة</button><button id="chJoin" class="btn ghost">🔗 انضمام</button></div>
    <div id="chList"></div>
  </section>

  <section id="tab-me" class="tab">
    <div class="card center"><input id="nameIn" maxlength="20" placeholder="اسمك"></div>
    <div class="card" id="statsCard"></div>
    <div class="card"><div class="mut small">مجموعة الأدعية (هدية كل يوم تنجز فيه المهام)</div><div id="coll" class="coll"></div></div>
    <div class="card"><div class="mut small">المستويات</div><div id="badges" class="badges"></div></div>
    <div class="card"><button id="nfBtn" class="btn ghost wide"></button></div>
    <div class="mut small center" id="verTxt"></div>
  </section>
</main>

<nav>
  <button data-tab="home" class="on"><i>📿</i>تسبيح</button>
  <button data-tab="az"><i>🕌</i>الأذكار</button>
  <button data-tab="chat"><i>💬</i>محادثات</button>
  <button data-tab="me"><i>👤</i>حسابي</button>
</nav>

<div id="cv" class="hidden"><div class="cvh"><button id="cvBack">→</button><b id="cvT"></b><button id="cvInv" hidden>🔗</button></div><div id="msgs"></div>
<div class="cvc"><label class="ib">🖼<input id="imgF" type="file" accept="image/*" hidden></label><button id="mic" class="ib">🎤</button><input id="msgIn" maxlength="1000" placeholder="اكتب رسالة"><button id="sendB" class="ib">➤</button></div></div>
<div id="welcome" class="overlay hidden"><div class="sheet">
  <h2>أهلاً فيك 🌙</h2>
  <p class="mut">كل يوم 3 مهام صغيرة وهدية، وتنبيهات لطيفة تذكّرك</p>
  <input id="nameW" maxlength="20" placeholder="اسمك (اختياري)">
  <button id="startW" class="btn gold wide">ابدأ</button>
</div></div>
<div id="modal" class="overlay hidden"><div class="sheet center" id="mBody"></div></div>
<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="version.js"></script>
<script src="app.js"></script>
</body>
</html>
